name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:domain
      - run: pnpm run test:browse
      - run: pnpm run test:clients
      - run: pnpm run test:excel
      - run: pnpm run test:pdf
      - run: pnpm run test:shared
      - run: pnpm run test:local-auth
      - run: pnpm run test:office
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/office-browser" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Test office workflows in Chrome
        env:
          PLAYWRIGHT_MODULES_PATH: ${{ runner.temp }}/office-browser/node_modules
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          OFFICE_TEST_ARTIFACTS: ${{ runner.temp }}/office-ui
        run: |
          pnpm run dev --host 127.0.0.1 --port 4175 > "$RUNNER_TEMP/office-vite.log" 2>&1 &
          node -e 'async function ready(){for(let i=0;i<30;i++){try{if((await fetch("http://127.0.0.1:4175/Mawatheeq/")).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)}ready()'
          node scripts/verify-office-ui.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: office-ui-diagnostics
          path: |
            ${{ runner.temp }}/office-ui
            ${{ runner.temp }}/office-vite.log
      - run: pnpm run build:pages
        env:
          PAGES_BASE_PATH: /Mawatheeq/
      - name: Check shared backend is configured
        if: github.event_name != 'pull_request'
        run: pnpm run check:pages-config
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist-pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
